name: ETL Full

on:
  workflow_dispatch:
    inputs:
      app_env:
        description: "APP_ENV passed to ETL (e.g. test/prod)"
        required: false
        default: "test"
      dry_run_only:
        description: "Run dry-run phase only"
        required: false
        type: boolean
        default: false
      skip_dry_run:
        description: "Skip dry-run and run write phase only"
        required: false
        type: boolean
        default: false
  # Scheduled ETL is paused while the league is out of action.
  # Restore this block when recurring overnight runs should resume:
  # schedule:
  #   # GitHub cron is UTC. These cover 00:15 Asia/Jerusalem in both
  #   # daylight (+03) and standard (+02) time.
  #   - cron: '15 21 * * *'
  #   - cron: '15 22 * * *'

jobs:
  etl:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install ETL deps (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::RPostgres
            any::dplyr
            any::dbplyr
            any::glue
            any::digest
            any::tidyr
            any::purrr
            any::jsonlite
            any::lubridate
            any::janitor
            any::stringr
            any::tibble
            any::withr
            any::pool
            any::arrow

      - name: Run ETL wrapper
        shell: pwsh
        env:
          APP_ENV: test
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASS: ${{ secrets.PG_PASS }}
          PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $runnerLog = Join-Path 'logs' ("etl_runner_{0}.log" -f (Get-Date -Format 'yyyyMMdd_HHmmss'))
          "Starting ETL wrapper at $(Get-Date -Format s)" | Tee-Object -FilePath $runnerLog -Append

          $dryRunOnly = $false
          $skipDryRun = $false
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.app_env }}')) {
              $env:APP_ENV = '${{ inputs.app_env }}'
            }
            if ('${{ inputs.dry_run_only }}' -eq 'true') { $dryRunOnly = $true }
            if ('${{ inputs.skip_dry_run }}' -eq 'true') { $skipDryRun = $true }
          }
          $requiredEnv = @('PG_HOST','PG_PORT','PG_DB','PG_USER','PG_PASS')
          $missingEnv = $requiredEnv | Where-Object { [string]::IsNullOrWhiteSpace([string](Get-Item "Env:$_" -ErrorAction SilentlyContinue).Value) }
          if ($missingEnv.Count -gt 0) {
            throw ("Missing required ETL environment variable(s): " + ($missingEnv -join ', '))
          }

          try {
            $psExe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            if (-not (Test-Path $psExe)) {
              throw "Windows PowerShell executable not found at $psExe"
            }
            $psArgs = @(
              '-NoProfile',
              '-ExecutionPolicy', 'Bypass',
              '-File', './scripts/run_etl_full.ps1',
              '-BaseDir', '.'
            )
            if ($dryRunOnly) { $psArgs += '-DryRunOnly' }
            if ($skipDryRun) { $psArgs += '-SkipDryRun' }

            & $psExe @psArgs 2>&1 |
              Tee-Object -FilePath $runnerLog -Append
            if ($LASTEXITCODE -ne 0) {
              throw "ETL wrapper exited with code $LASTEXITCODE"
            }
          } catch {
            "Wrapper launch/run failure: $($_.Exception.Message)" | Tee-Object -FilePath $runnerLog -Append
            $latestWrapper = Get-ChildItem -Path logs -Filter 'etl_full_wrapper_*.log' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if ($null -ne $latestWrapper) {
              "---- BEGIN latest wrapper log ----" | Tee-Object -FilePath $runnerLog -Append
              Get-Content $latestWrapper.FullName -Tail 250 | Tee-Object -FilePath $runnerLog -Append
              "---- END latest wrapper log ----" | Tee-Object -FilePath $runnerLog -Append
            } else {
              "No wrapper log file found under logs/." | Tee-Object -FilePath $runnerLog -Append
            }
            throw
          }

      - name: Ensure cold-storage release exists
        if: ${{ success() && hashFiles('exports/cold/*.parquet') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view cold-storage/latest > /dev/null 2>&1 || \
            gh release create cold-storage/latest \
              --title "Cold Storage Exports" \
              --notes "Cumulative Parquet backups of ETL intermediate tables"

      # The ETL is when new tables and functions appear, and both arrive
      # unprotected: a new table has no RLS, and CREATE/DROP FUNCTION leaves
      # the function executable by PUBLIC while wiping app_readonly's EXECUTE
      # grants. Nothing else runs this audit, which is how
      # basketball_test.team_metrics_by_game_mv sat without RLS until
      # 2026-08-12. A failure here means the data published fine but the access
      # boundary drifted -- re-run scripts/apply_db_security.R, do not
      # re-run the ETL.
      - name: Audit database security boundary
        shell: pwsh
        env:
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASS: ${{ secrets.PG_PASS }}
          PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
        run: |
          # The audit reports drift through its exit code, and its stdout is
          # the actionable part. GitHub's pwsh shell presets
          # ErrorActionPreference=stop, which on PowerShell 7.4 turns a
          # non-zero native exit into a thrown error before the message below
          # can run -- so relax it around the call and branch explicitly.
          $ErrorActionPreference = 'Continue'
          Rscript scripts/audit_db_security.R
          $auditExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($auditExit -ne 0) {
            throw "Database security audit reported violations (ETL itself succeeded); see the table above and re-run scripts/apply_db_security.R."
          }

      - name: Upload ETL logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: etl-logs-${{ github.run_id }}
          path: |
            logs/etl_runner_*.log
            logs/etl_full_wrapper_*.log
            etl/logs/etl_full_*.log
            etl/logs/last_success.txt
          if-no-files-found: warn

      - name: Show ETL process log tail
        if: ${{ always() }}
        shell: pwsh
        run: |
          $latest = Get-ChildItem -Path etl/logs -Filter 'etl_full_*.log' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $latest) {
            Write-Host "No ETL process log found under etl/logs."
            exit 0
          }
          Write-Host "Showing tail of $($latest.FullName)"
          Write-Host "----- BEGIN ETL LOG TAIL -----"
          Get-Content $latest.FullName -Tail 200
          Write-Host "----- END ETL LOG TAIL -----"
