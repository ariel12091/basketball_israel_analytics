name: R Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install test deps
        run: |
          Rscript -e "install.packages(c('testthat','shiny','dplyr','DT','bslib','purrr','htmltools'), repos='https://cloud.r-project.org')"

      - name: Run tests
        run: |
          Rscript scripts/test_all.R
