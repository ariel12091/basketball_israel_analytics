name: R Tests

on:
  workflow_dispatch:
    inputs:
      run_full:
        description: "Run full suite (live DB pins, every season)"
        required: false
        default: false
        type: boolean
  # The R suite runs only when R code, SQL or a file the tests read changed;
  # a web- or docs-only change has nothing here to break.
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'api/**'
      - 'etl/**'
      - 'sql/**'
      - 'scripts/**'
      - 'docs/shared_definitions.md'
      - 'docs/superpowers/specs/**'
      - '.github/workflows/r-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'api/**'
      - 'etl/**'
      - 'sql/**'
      - 'scripts/**'
      - 'docs/shared_definitions.md'
      - 'docs/superpowers/specs/**'
      - '.github/workflows/r-tests.yml'
  schedule:
    - cron: '0 3 * * *'

jobs:
  fast-tests:
    if: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.run_full == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install test deps (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::shiny
            any::dplyr
            any::dbplyr
            any::DT
            any::bslib
            any::purrr
            any::htmltools
            any::DBI
            any::pool
            any::RPostgres
            any::plumber
            any::callr
            any::V8

      - name: Run fast suite
        env:
          RUN_DB_TESTS: '0'
        run: |
          Rscript scripts/test_all.R

  nightly-full-tests:
    permissions:
      contents: read
      issues: write
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full == 'true') }}
    runs-on: ubuntu-latest
    env:
      RUN_DB_TESTS: '1'
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_PORT: ${{ secrets.PG_PORT }}
      PG_DB: ${{ secrets.PG_DB }}
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASS: ${{ secrets.PG_PASS }}
      PG_SSLMODE: ${{ secrets.PG_SSLMODE }}

    steps:
      - uses: actions/checkout@v4

      # Live DB tests check the current season every night and every season
      # once a week (Sunday's run, or a manual full run): a finished season
      # changes only when code or SQL does. app/tests/testthat/helper-db-connect.R.
      - name: Choose DB test scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "DB_TEST_SCOPE=full" >> "$GITHUB_ENV"
            echo "DB test scope: every season"
          else
            echo "DB test scope: current season"
          fi

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install test deps (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::shiny
            any::dplyr
            any::dbplyr
            any::DT
            any::bslib
            any::purrr
            any::htmltools
            any::DBI
            any::pool
            any::RPostgres
            any::plumber
            any::callr
            any::V8

      - name: Run full suite
        env:
          RUN_DB_TESTS: ${{ env.RUN_DB_TESTS }}
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASS: ${{ secrets.PG_PASS }}
          PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
        run: |
          Rscript scripts/test_all.R

      # A red nightly run must be seen: open an issue (or comment on the open one).
      - name: Report nightly failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly R tests failing"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The nightly DB + golden run failed: $RUN_URL. Close this issue once it is green again."
          fi
