name: R Tests

on:
  workflow_dispatch:
    inputs:
      run_full:
        description: "Run full suite (E2E + DB parity)"
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  fast-tests:
    if: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.run_full == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install test deps (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::shiny
            any::dplyr
            any::DT
            any::bslib
            any::purrr
            any::htmltools
            any::shinytest2
            any::DBI
            any::pool
            any::RPostgres

      - name: Run fast suite
        env:
          RUN_E2E: '0'
          RUN_DB_TESTS: '0'
        run: |
          Rscript scripts/test_all.R

  nightly-full-tests:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install test deps (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::shiny
            any::dplyr
            any::DT
            any::bslib
            any::purrr
            any::htmltools
            any::shinytest2
            any::DBI
            any::pool
            any::RPostgres

      - name: Run full suite (E2E + DB parity)
        env:
          RUN_E2E: '1'
          RUN_DB_TESTS: '1'
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASS: ${{ secrets.PG_PASS }}
          PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
        run: |
          Rscript scripts/test_all.R
