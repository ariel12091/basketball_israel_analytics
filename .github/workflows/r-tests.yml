name: R Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  fast-tests:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install test deps
        run: |
          Rscript -e "install.packages(c('testthat','shiny','dplyr','DT','bslib','purrr','htmltools','shinytest2','DBI','RPostgres'), repos='https://cloud.r-project.org')"

      - name: Run fast suite
        env:
          RUN_E2E: '0'
          RUN_DB_TESTS: '0'
        run: |
          Rscript scripts/test_all.R

  nightly-full-tests:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install test deps
        run: |
          Rscript -e "install.packages(c('testthat','shiny','dplyr','DT','bslib','purrr','htmltools','shinytest2','DBI','RPostgres'), repos='https://cloud.r-project.org')"

      - name: Run full suite (E2E + DB parity)
        env:
          RUN_E2E: '1'
          RUN_DB_TESTS: '1'
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASS: ${{ secrets.PG_PASS }}
          PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
        run: |
          Rscript scripts/test_all.R
