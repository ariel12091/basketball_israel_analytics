name: EuroLeague load

# Loads every EuroLeague and EuroCup game that the provider lists as played,
# whose tip-off was at least 3 hours ago, and that is not yet in
# euroleague.schedule, for the current provider season (2026 = 2026-27).
# Insert-only: existing games are never requested, so nothing already loaded is
# republished. Writes only the `euroleague` schema.
# See euroleague/scripts/load_new_games.py and euroleague/RUNBOOK.md.

on:
  # Primary evening load: right after the Israeli nightly finishes. Measured
  # 2026-09-23..29, GitHub created only two evening runs per night (~21:40 and
  # ~00:40 UTC; the 18:23-20:23 slots never fired), so games tipping at 18:45
  # UTC waited ~3h past their 3-hour mark. The Israeli ETL (cron 19:15 UTC,
  # started ~2.5h late) now ends ~21:45-22:10 UTC, after most games fall due,
  # and chaining after it can never collide with it.
  workflow_run:
    workflows: ["ETL Full"]
    types: [completed]
  schedule:
    # Best-effort backups. 2026-27 fixtures: EuroLeague Tue-Fri, EuroCup
    # Tue-Wed (2 Thu), tip-offs 15:30-20:00 UTC, so games fall due
    # 18:30-23:00 UTC. :23 avoids the top-of-hour queue.
    - cron: '23 18-23 * * 2-5'
    # Daily catch-up: games whose evening run was skipped (Israeli ETL
    # running) or delayed, and playoff / Final Four games on other weekdays.
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      competitions:
        description: "Comma-separated provider competitions: E=EuroLeague, U=EuroCup"
        required: false
        default: "E,U"
      season:
        description: "Provider season (2026 = 2026-27). Empty = current season."
        required: false
        default: ""
      execute:
        description: "Publish to the database. Off = collect + stage only."
        required: false
        type: boolean
        default: true
      dq_report:
        description: "Run the data quality report even if nothing was published."
        required: false
        type: boolean
        default: false

# One EuroLeague load at a time: the verifier reads the latest load run, and a
# second publisher would race it.
concurrency:
  group: euroleague-load
  cancel-in-progress: false

jobs:
  # The Israeli nightly (etl-full.yml) is scheduled 19:15 UTC and GitHub starts
  # it ~2.5h late, ~21:35-22:00 UTC -- inside this load window. Never run
  # alongside it: skip, and the workflow_run trigger above loads whatever this
  # one would have as soon as it completes.
  israeli-etl-guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      busy: ${{ steps.check.outputs.busy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow etl-full.yml -L 20 \
                --json status -q '[.[] | select(.status != "completed")] | length')
          echo "busy=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$n" -gt 0 ]; then
            echo "Israeli ETL has $n run(s) in progress or queued; skipping this load." >> "$GITHUB_STEP_SUMMARY"
          fi

  load:
    needs: israeli-etl-guard
    if: needs.israeli-etl-guard.outputs.busy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: euroleague
    env:
      COMPETITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.competitions || 'E,U' }}
      SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.season || '' }}
      EXECUTE: ${{ github.event_name != 'workflow_dispatch' || inputs.execute }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: euroleague/pyproject.toml

      - name: Install loader
        run: pip install -e .

      # The loader reads credentials from etl/.Renviron (gitignored) and always
      # connects on the direct port 5432, whatever PG_PORT says.
      - name: Write database credentials
        env:
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASS: ${{ secrets.PG_PASS }}
          PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
        run: |
          for v in PG_HOST PG_DB PG_USER PG_PASS; do
            [ -n "${!v}" ] || { echo "missing secret $v"; exit 1; }
          done
          umask 077
          {
            echo "PG_HOST=$PG_HOST"
            echo "PG_DB=$PG_DB"
            echo "PG_USER=$PG_USER"
            echo "PG_PASS=$PG_PASS"
            echo "PG_SSLMODE=${PG_SSLMODE:-require}"
          } > ../etl/.Renviron

      - name: Load new games
        id: load
        run: |
          mkdir -p logs
          status=0
          for comp in ${COMPETITIONS//,/ }; do
            args=(--competition "$comp")
            [ -n "$SEASON" ] && args+=(--season "$SEASON")
            [ "$EXECUTE" = "true" ] && args+=(--execute)
            echo "::group::competition $comp"
            python scripts/load_new_games.py "${args[@]}" 2>&1 | tee "logs/load_${comp}.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            {
              echo "### $comp: exit $rc"
              echo '```'
              grep -E "^competition=|^new gamecodes|nothing to load|PASS|FAIL|CHECKS? |exceeds" "logs/load_${comp}.log" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || status=1
          done
          # The data quality report runs only after a load that published a game.
          if grep -qE "^publication_games=[1-9]" logs/load_*.log 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          exit $status

      # Data quality report (euroleague/scripts/run_euro_data_quality_report.R)
      # after every load that published a game, whether or not the load's own
      # checks passed (or on a manual run with dq_report). Read-only; about 3 minutes. Findings do not fail the run.
      - uses: r-lib/actions/setup-r@v2
        if: ${{ always() && (steps.load.outputs.published == 'true' || inputs.dq_report) }}
        with:
          r-version: '4.4.2'

      - name: Install report deps (cached)
        if: ${{ always() && (steps.load.outputs.published == 'true' || inputs.dq_report) }}
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::RPostgres

      - name: Data quality report
        if: ${{ always() && (steps.load.outputs.published == 'true' || inputs.dq_report) }}
        env:
          PG_PORT: '5432'
          DQ_OUTPUT_DIR: logs/data_quality
        run: |
          Rscript scripts/run_euro_data_quality_report.R
          {
            echo "### Data quality report"
            sed -n '/^Overall status/p' logs/data_quality/latest.md
            echo
            echo "| check | status | rows | title |"
            echo "| --- | --- | --- | --- |"
            awk -F' [|] ' '/^\| [A-Z]/ && ($3 == "fail" || $3 == "warning") { print "| " substr($1, 3) " | " $3 " | " $5 " | " $6 " |" }' logs/data_quality/latest.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data quality report
        if: ${{ always() && (steps.load.outputs.published == 'true' || inputs.dq_report) }}
        uses: actions/upload-artifact@v4
        with:
          name: euroleague-data-quality-${{ github.run_id }}
          path: euroleague/logs/data_quality/
          if-no-files-found: ignore

      - name: Upload load logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: euroleague-load-${{ github.run_id }}
          path: euroleague/logs/load_*.log
          if-no-files-found: ignore

      - name: Remove credentials
        if: ${{ always() }}
        run: rm -f ../etl/.Renviron
