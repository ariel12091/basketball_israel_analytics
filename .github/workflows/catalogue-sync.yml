name: Catalogue Sync

# Keeps the app's copy of the catalogue tables (season_teams, game_types) in
# step with the database. Runs after each successful nightly ETL: adds teams a
# new season brought in, regenerates app/R/catalogues_generated.R, commits it
# when it changed (which deploys), and fails when the schedule holds a
# game_type the game_types table cannot name.

on:
  workflow_run:
    workflows: ["ETL Full"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Install deps (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::RPostgres

      - name: Sync catalogues
        id: sync
        env:
          CONFIRM_CATALOGUE_SYNC: '1'
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASS: ${{ secrets.PG_PASS }}
          PG_SSLMODE: ${{ secrets.PG_SSLMODE }}
        run: Rscript scripts/sync_catalogues.R

      # Runs even when the sync step failed on an uncatalogued game_type: the
      # generated file is written before that check, and new teams should not
      # wait on a label.
      - name: Commit the generated copy if it changed
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- app/R/catalogues_generated.R; then
            echo "Generated catalogue copy unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/R/catalogues_generated.R
          git commit -m "Regenerate catalogue copy from season_teams and game_types"
          git pull --rebase
          git push
