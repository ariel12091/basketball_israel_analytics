name: Deploy (Gated)

on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
      - name: Install test deps
        run: |
          Rscript -e "install.packages(c('testthat','shiny','dplyr','DT','bslib','purrr','htmltools','shinytest2','DBI','RPostgres'), repos='https://cloud.r-project.org')"
      - name: Run test gate
        env:
          RUN_E2E: '0'
          RUN_DB_TESTS: '0'
        run: |
          Rscript scripts/test_all.R

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ needs.tests.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy gate passed
        run: |
          echo "All tests passed. Insert your deploy command in this job."
