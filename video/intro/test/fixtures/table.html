<!doctype html>
<html><head><meta charset="utf-8"><title>fixture</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/css/jquery.dataTables.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/js/jquery.dataTables.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/selectize.js/0.15.2/css/selectize.default.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/selectize.js/0.15.2/js/selectize.min.js"></script>
</head><body style="background:#14100C;color:#eee;font:16px sans-serif">
<div id="dt"><table id="t" class="display"><thead><tr><th>Player</th><th>Hidden</th><th>Net RTG Diff</th></tr></thead>
<tbody>
<tr><td>JIMMY CLARK III</td><td>x</td><td>+17.0</td></tr>
<tr><td>ROMAN SORKIN</td><td>y</td><td>-3.1</td></tr>
</tbody></table></div>
<div id="dt2"><table id="t2" class="display"><thead><tr><th>Team</th><th>Net</th></tr></thead>
<tbody><tr><td>MACCABI TEL AVIV</td><td>20.9<br>#1</td></tr></tbody></table></div>
<select id="teams" multiple><option value="2">MACCABI TEL AVIV</option><option value="12" selected>KIRYAT ATA</option></select>
<button id="slow">Slow</button> <span id="val">old</span>
<button id="late" style="display:none">Late</button>
<script>
$(function () {
  $('#t').DataTable({ paging: false, searching: false, info: false, columnDefs: [{ targets: 1, visible: false }] });
  // Like the app's tables: scrollX splits the header into a cloned table.
  $('#t2').DataTable({ paging: false, searching: false, info: false, scrollX: true });
  // Like the app's team filter: a multi-select that may already hold a team.
  $('#teams').selectize({ plugins: ['remove_button'] });
  // Like the app's debounced inputs: the reload only starts 400 ms after the click.
  $('#slow').on('click', function () {
    setTimeout(function () {
      $('#val').addClass('recalculating');
      setTimeout(function () { $('#val').text('new').removeClass('recalculating'); }, 800);
    }, 400);
  });
  setTimeout(function () { $('#late').show(); }, 1200);
});
</script>
</body></html>
